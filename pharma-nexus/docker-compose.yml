services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pharma_nexus
      POSTGRES_PASSWORD: pharma_nexus
      POSTGRES_DB: pharma_nexus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: ./start.sh --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://pharma_nexus:pharma_nexus@postgres:5432/pharma_nexus
      DATABASE_URL_SYNC: postgresql+psycopg2://pharma_nexus:pharma_nexus@postgres:5432/pharma_nexus
      CORS_ORIGINS: "http://localhost:3000"
      APP_DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      target: dev
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
